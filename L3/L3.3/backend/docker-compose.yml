version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: comment-postgres
    environment:
      POSTGRES_DB: comment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/internal/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comment-network

  app:
    build: .
    container_name: comment-app
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - POSTGRES_URL=postgres://postgres:postgres@postgres:5432/comment?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comment-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  comment-network:
    driver: bridge