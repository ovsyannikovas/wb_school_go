version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: delayed-notifier-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - notifier-network

  redis:
    image: redis:7-alpine
    container_name: delayed-notifier-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - notifier-network

  app:
    build:
      context: ../../..  # Контекст на уровень корня проекта (wb_school_go/)
      dockerfile: L3/L3.1/backend/Dockerfile  # Путь к Dockerfile относительно контекста
    container_name: delayed-notifier-app
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - MAX_RETRIES=3
      - RETRY_DELAY_BASE=5
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - notifier-network
    restart: unless-stopped

volumes:
  rabbitmq_data:
  redis_data:

networks:
  notifier-network:
    driver: bridge