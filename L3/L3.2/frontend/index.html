<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
        }
        button:hover { background: #5a67d8; }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f0f9ff;
            border-radius: 5px;
            display: none;
        }
        .short-url {
            font-size: 18px;
            color: #667eea;
            word-break: break-all;
        }
        .error {
            color: #f56565;
            padding: 10px;
            background: #fed7d7;
            border-radius: 5px;
        }
        .info {
            color: #48bb78;
            padding: 10px;
            background: #c6f6d5;
            border-radius: 5px;
        }
        .recent-list {
            margin-top: 20px;
        }
        .recent-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .recent-item:hover {
            background: #f7fafc;
        }
        .recent-code {
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🔗 URL Shortener</h1>
        <p>Сокращайте длинные ссылки</p>
    </header>

    <div class="card">
        <h2>Создать короткую ссылку</h2>
        <form id="shortenForm">
            <div class="form-group">
                <label for="url">Длинный URL:</label>
                <input type="url" id="url" required placeholder="https://example.com/very/long/url">
            </div>
            <div class="form-group">
                <label for="customCode">Кастомный код (опционально):</label>
                <input type="text" id="customCode" placeholder="my-custom-name">
            </div>
            <div class="form-group">
                <label for="expiresIn">Срок действия (часов, опционально):</label>
                <input type="number" id="expiresIn" min="1" placeholder="24">
            </div>
            <button type="submit" id="createBtn">🔗 Создать короткую ссылку</button>
        </form>
        <div id="result" class="result"></div>
    </div>

    <div class="card">
        <h2>Аналитика по ссылке</h2>
        <div class="form-group">
            <label for="analyticsCode">Короткий код:</label>
            <input type="text" id="analyticsCode" placeholder="abc123">
        </div>
        <button id="getAnalyticsBtn">📊 Показать аналитику</button>
        <div id="analyticsResult" class="result" style="display: none;"></div>
    </div>

    <div class="card" id="recentUrls" style="display: none;">
        <h2>Последние ссылки</h2>
        <div class="recent-list" id="recentList"></div>
    </div>
</div>

<script>
    const API_BASE = 'http://localhost:8080/api';

    document.getElementById('shortenForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btn = document.getElementById('createBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Создание...';

        try {
            const response = await fetch(`${API_BASE}/shorten`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    url: document.getElementById('url').value,
                    custom_code: document.getElementById('customCode').value || undefined,
                    expires_in: document.getElementById('expiresIn').value ? parseInt(document.getElementById('expiresIn').value) : undefined
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Ошибка создания');
            }

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <div class="info">✅ Ссылка создана!</div>
                <div class="short-url">${data.short_url}</div>
                <div style="margin-top: 10px;">Код: ${data.short_code}</div>
                <button onclick="copyToClipboard('${data.short_url}')" style="margin-top: 10px;">📋 Копировать</button>
            `;

            document.getElementById('shortenForm').reset();
        } catch (err) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<div class="error">❌ ${err.message}</div>`;
        } finally {
            btn.disabled = false;
            btn.textContent = '🔗 Создать короткую ссылку';
        }
    });

    document.getElementById('getAnalyticsBtn').addEventListener('click', async () => {
        const code = document.getElementById('analyticsCode').value.trim();
        if (!code) {
            alert('Введите код ссылки');
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/analytics/${code}`);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Ошибка загрузки');
            }

            const resultDiv = document.getElementById('analyticsResult');
            resultDiv.style.display = 'block';

            let dailyHtml = '';
            if (data.daily && data.daily.length > 0) {
                dailyHtml = '<h3>📅 По дням</h3><ul>';
                data.daily.forEach(d => {
                    dailyHtml += `<li>${d.date}: ${d.clicks} переходов</li>`;
                });
                dailyHtml += '</ul>';
            }

            resultDiv.innerHTML = `
                <h3>Статистика для ${data.url.short_code}</h3>
                <div class="info">
                    <div>📊 Всего переходов: ${data.stats.total_clicks}</div>
                    <div>👤 Уникальных IP: ${data.stats.unique_ips}</div>
                    <div>💻 Десктоп: ${data.stats.desktop_clicks}</div>
                    <div>📱 Мобильные: ${data.stats.mobile_clicks}</div>
                </div>
                ${dailyHtml}
            `;
        } catch (err) {
            const resultDiv = document.getElementById('analyticsResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<div class="error">❌ ${err.message}</div>`;
        }
    });

    window.copyToClipboard = (text) => {
        navigator.clipboard.writeText(text).then(() => {
            alert('Скопировано!');
        });
    };
</script>
</body>
</html>
